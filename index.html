<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DAVBOT AI</title>


<style>

/* ==================================================
   DAVBOT AI CHATGPT STYLE
   PARTIE 1/3
================================================== */


*{

    margin:0;
    padding:0;
    box-sizing:border-box;

}


:root{

    --bg:#050816;

    --panel:#0b1224;

    --panel2:#101a32;

    --blue:#00d2ff;

    --blue2:#0066ff;

    --text:#f5f7ff;

    --muted:#8894ad;

    --border:
    rgba(255,255,255,.08);

}



body{

    width:100%;

    height:100vh;

    overflow:hidden;

    background:var(--bg);

    color:white;

    font-family:

    Arial,

    Helvetica,

    sans-serif;

}



/* ================================
   APP
================================ */


.app{

    display:flex;

    height:100vh;

}



/* ================================
   SIDEBAR
================================ */


.sidebar{

    width:280px;

    height:100vh;

    background:

    linear-gradient(
    180deg,
    #080d1c,
    #050816
    );


    border-right:

    1px solid var(--border);


    padding:15px;


    display:flex;

    flex-direction:column;


}



/* LOGO */


.brand{

    display:flex;

    align-items:center;

    gap:12px;

    margin-bottom:20px;

}



.logo{

    width:48px;

    height:48px;


    border-radius:16px;


    display:flex;

    justify-content:center;

    align-items:center;


    font-size:25px;


    background:

    linear-gradient(
    135deg,
    var(--blue),
    var(--blue2)
    );


    box-shadow:

    0 0 30px
    rgba(0,210,255,.4);


}



.brand h2{

    font-size:20px;

}



.brand h2 span{

    color:var(--blue);

}



.brand p{

    color:var(--muted);

    font-size:12px;

}



/* NOUVEAU CHAT */


.new-chat{


    width:100%;


    padding:13px;


    border-radius:14px;


    border:

    1px solid var(--border);


    background:

    var(--panel2);


    color:white;


    cursor:pointer;


    font-size:14px;


    transition:.2s;


}



.new-chat:hover{

    background:#172442;

    transform:translateY(-2px);

}



/* MENU */


.menu{

    margin-top:20px;

}



.menu a{


    display:block;


    padding:12px;


    margin-bottom:6px;


    border-radius:12px;


    color:#cbd5e1;


    text-decoration:none;


    transition:.2s;


}



.menu a:hover{

    background:#111a32;

    color:white;

}



/* TITRE */


.sidebar h4{

    margin-top:20px;

    color:#64708a;

    font-size:12px;

    text-transform:uppercase;

}



/* HISTORIQUE */


.history{

    flex:1;

    overflow-y:auto;

    margin-top:10px;


}



.history-item{


    padding:10px;


    border-radius:10px;


    color:#b9c3d8;


    cursor:pointer;


    font-size:13px;


    margin-bottom:5px;


}



.history-item:hover{

    background:#111a32;

}



/* PROFIL */


.profile{


    display:flex;

    align-items:center;


    gap:10px;


    padding:12px;


    background:#10182d;


    border-radius:15px;


}



.avatar{


    width:40px;

    height:40px;


    display:flex;


    justify-content:center;


    align-items:center;


    border-radius:12px;


    background:#17233e;


}



.profile strong{

    font-size:14px;

}



.profile p{

    color:var(--muted);

    font-size:12px;

}



/* ================================
   MAIN
================================ */


.main{

    flex:1;


    display:flex;


    flex-direction:column;


}



/* HEADER */


.topbar{


    height:65px;


    display:flex;


    align-items:center;


    justify-content:space-between;


    padding:0 20px;


    background:#050816;


    border-bottom:

    1px solid var(--border);


}



.topbar h3{

    font-size:18px;

}



#menuBtn{


    display:none;


    background:none;


    border:none;


    color:white;


    font-size:25px;


}



.online{


    color:#4dff91;


    font-size:13px;


}
/* ================================
   ZONE CHAT
================================ */


.chat{

    flex:1;

    overflow-y:auto;

    padding:

    30px 25px 130px;


    scroll-behavior:smooth;


}



.chat::-webkit-scrollbar{

    width:5px;

}


.chat::-webkit-scrollbar-thumb{

    background:#172442;

    border-radius:20px;

}



/* ================================
   BIENVENUE
================================ */


.welcome{


    height:70%;


    display:flex;


    flex-direction:column;


    justify-content:center;


    align-items:center;


    text-align:center;


}



.ai-logo{


    width:90px;

    height:90px;


    border-radius:30px;


    display:flex;


    justify-content:center;


    align-items:center;


    font-size:42px;



    background:

    linear-gradient(
    135deg,
    var(--blue),
    var(--blue2)
    );


    box-shadow:

    0 0 50px
    rgba(0,210,255,.35);


}



.welcome h1{


    margin-top:25px;


    font-size:32px;


}



.welcome h1 span{


    color:var(--blue);


}



.welcome p{


    margin-top:10px;


    color:var(--muted);


    max-width:400px;


}



/* SUGGESTIONS */


.suggestions{


    margin-top:25px;


    display:flex;


    gap:10px;


    flex-wrap:wrap;


    justify-content:center;


}



.suggestions button{


    padding:11px 16px;


    border-radius:15px;


    background:#101a32;


    color:#d8e2f5;


    border:

    1px solid var(--border);


    cursor:pointer;


    transition:.2s;


}



.suggestions button:hover{


    border-color:var(--blue);


    transform:translateY(-2px);


}



/* ================================
   MESSAGES
================================ */


.message{


    display:flex;


    gap:10px;


    margin:20px 0;


    animation:

    showMessage .25s ease;


}



@keyframes showMessage{


from{

    opacity:0;

    transform:translateY(10px);

}


to{

    opacity:1;

    transform:translateY(0);

}


}



.message.user{


    justify-content:flex-end;


}



.message.user .avatar{


    order:2;


    background:

    linear-gradient(
    135deg,
    var(--blue2),
    var(--blue)
    );


}



.bubble{


    max-width:75%;


    padding:14px 16px;


    background:#101a32;


    border-radius:18px;


    line-height:1.6;


    font-size:14px;


    color:#f1f5ff;


    border:

    1px solid var(--border);


    white-space:pre-wrap;


}



.message.user .bubble{


    background:

    linear-gradient(
    135deg,
    #0066ff,
    #00aaff
    );


    border:none;


}



/* ================================
   INPUT
================================ */


.input-area{


    position:fixed;


    bottom:0;


    left:280px;


    right:0;


    padding:15px;


    background:

    linear-gradient(
    transparent,
    #050816 35%
    );


}



.input-box{


    max-width:900px;


    margin:auto;


    display:flex;


    align-items:flex-end;


    gap:10px;


    padding:10px;


    background:#10182d;


    border-radius:22px;


    border:

    1px solid var(--border);


}



textarea{


    flex:1;


    height:45px;


    max-height:120px;


    resize:none;


    background:none;


    border:none;


    outline:none;


    color:white;


    padding:12px;


    font-size:14px;


    font-family:inherit;


}



textarea::placeholder{


    color:#65718b;


}



#sendButton{


    width:45px;


    height:45px;


    border:none;


    border-radius:15px;


    cursor:pointer;


    color:white;


    font-size:18px;


    background:

    linear-gradient(
    135deg,
    var(--blue),
    var(--blue2)
    );


    transition:.2s;


}



#sendButton:hover{


    transform:scale(1.05);


    box-shadow:

    0 0 20px
    rgba(0,210,255,.4);


}
/* ================================
   MOBILE RESPONSIVE
================================ */


@media(max-width:700px){


.sidebar{

    position:fixed;

    left:-300px;

    top:0;

    z-index:20;

    transition:.3s;

}


.sidebar.active{

    left:0;

}



#menuBtn{

    display:block;

}



.input-area{

    left:0;

}



.chat{

    padding:

    20px 12px 120px;

}



.welcome h1{

    font-size:25px;

}



.ai-logo{

    width:75px;

    height:75px;

    font-size:35px;

}



.bubble{

    max-width:85%;

    font-size:13px;

}



.suggestions button{

    font-size:12px;

}


}




/* ================================
   TYPING IA
================================ */


.typing{

    display:flex;

    gap:5px;

}



.typing span{

    width:7px;

    height:7px;

    background:var(--blue);

    border-radius:50%;

    animation:

    typing 1s infinite;

}



.typing span:nth-child(2){

    animation-delay:.2s;

}



.typing span:nth-child(3){

    animation-delay:.4s;

}



@keyframes typing{


0%,100%{

    opacity:.3;

    transform:translateY(0);

}



50%{

    opacity:1;

    transform:translateY(-5px);

}


}


@media(max-width:700px){

.sidebar{

    position:fixed;

    left:-300px;

    top:0;

    bottom:0;

    transition:.3s ease;

}


.sidebar.active{

    left:0;

    box-shadow:
    0 0 40px rgba(0,0,0,.6);

}

}
</style>

</head>


<body>


<div class="app">



<!-- ================= SIDEBAR ================= -->


<aside class="sidebar" id="sidebar">


<div class="brand">


<div class="logo">

🤖

</div>


<div>


<h2>

DAVBOT <span>AI</span>

</h2>


<p>

Assistant intelligent

</p>


</div>


</div>





<button class="new-chat" id="newChat">

＋ Nouvelle discussion

</button>





<nav class="menu">


<a href="index.html">

💬 Chat

</a>


<a href="projet.html">

🚀 Projet

</a>


</nav>





<h4>

Historique

</h4>



<div class="history" id="historyList">

</div>






<div class="profile">


<div class="avatar">

👤

</div>



<div>


<strong id="userName">

Utilisateur

</strong>


<p>

DAVBOT AI

</p>


</div>


</div>


</aside>







<!-- ================= MAIN ================= -->


<main class="main">



<header class="topbar">


<button id="menuBtn">

☰

</button>



<h3>

DAVBOT AI

</h3>



<div class="online">

🟢 Gemini

</div>


</header>







<section class="chat" id="chat">



<div class="welcome" id="welcome">


<div class="ai-logo">

🤖

</div>



<h1>

Bienvenue sur

<span>

DAVBOT AI

</span>

</h1>



<p>

Ton assistant IA pour créer,
coder et développer tes projets.

</p>




<div class="suggestions">


<button data-msg="Explique moi l'intelligence artificielle">

🤖 Intelligence artificielle

</button>



<button data-msg="Crée une idée de projet">

🚀 Projet

</button>



<button data-msg="Aide moi à programmer">

💻 Programmation

</button>


</div>


</div>



</section>








<footer class="input-area">


<div class="input-box">



<textarea

id="messageInput"

placeholder="Écris un message à DAVBOT..."

></textarea>

➤

</button>

</div>






<script src="app.js"></script>



<script>

/* ==============================
   MENU MOBILE DAVBOT AI
============================== */

const menuBtn = 
document.getElementById("menuBtn");


const sidebar = 
document.getElementById("sidebar");



if(menuBtn && sidebar){


    // Ouvrir / fermer avec le bouton

    menuBtn.onclick = function(e){

        e.stopPropagation();

        sidebar.classList.toggle("active");

    };



    // Fermer en cliquant dans le chat

    document.addEventListener(
    "click",
    function(e){


        if(
            !sidebar.contains(e.target)
            &&
            !menuBtn.contains(e.target)
        ){

            sidebar.classList.remove(
                "active"
            );

        }


    });



    // Fermer après clic sur un lien

    document
    .querySelectorAll(".menu a")
    .forEach(link=>{


        link.onclick=function(){

            sidebar.classList.remove(
                "active"
            );

        };


    });


}


</script>


</body>

</html>
