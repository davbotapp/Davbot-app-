<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080b14">
  <meta name="description" content="DAVBOT AI — assistant intelligent pour discuter, créer des projets et générer des images.">
  <title>DAVBOT AI</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 2.5 14.7 9l6.8 3-6.8 3L12 21.5 9.3 15 2.5 12l6.8-3L12 2.5Z"/><path d="m18.5 3 .8 2.1L21.5 6l-2.2.9-.8 2.1-.9-2.1L15.5 6l2.1-.9.9-2.1Z"/></svg>
        </div>
        <div><b>DAVBOT</b><span>AI</span></div>
      </div>

      <button class="new-chat" id="newChat" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        Nouvelle discussion
      </button>

      <nav class="main-nav" aria-label="Navigation">
        <button class="nav-item active" data-view="chat" type="button">
          <svg viewBox="0 0 24 24"><path d="M5 5.5h14A2.5 2.5 0 0 1 21.5 8v7A2.5 2.5 0 0 1 19 17.5H11l-4.5 3v-3H5A2.5 2.5 0 0 1 2.5 15V8A2.5 2.5 0 0 1 5 5.5Z"/></svg>
          Chat
        </button>
      </nav>

      <div class="history-title">Discussions</div>
      <div id="history" class="history"></div>

      <div class="sidebar-bottom">
        <button id="themeBtn" class="small-action" type="button" title="Changer de thème">
          <svg viewBox="0 0 24 24"><path d="M20 15.2A8.5 8.5 0 0 1 8.8 4 8.5 8.5 0 1 0 20 15.2Z"/></svg>
          Thème
        </button>
        <button id="clearBtn" class="small-action danger" type="button" title="Supprimer les discussions">
          <svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V4.5h6V7m-8 0 .8 13h8.4L17 7M10 10.5v6M14 10.5v6"/></svg>
          Effacer
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn mobile-only" type="button" aria-label="Menu">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div>
          <div class="top-title">DAVBOT AI</div>
          <div class="status"><i></i> Assistant connecté</div>
        </div>
        <button id="exportBtn" class="icon-btn" type="button" title="Exporter la discussion" aria-label="Exporter">
          <svg viewBox="0 0 24 24"><path d="M12 3v12M8 11l4 4 4-4M5 19.5h14"/></svg>
        </button>
      </header>

      <section id="chatView" class="view">
        <div id="messages" class="messages"></div>
        <div id="typing" class="typing hidden"><span></span><span></span><span></span></div>

        <div class="composer-wrap">
          <div id="attachPreview" class="attach-preview hidden"></div>
          <div class="composer">
            <button id="attachBtn" class="composer-btn" type="button" title="Joindre un fichier" aria-label="Joindre un fichier">
              <svg viewBox="0 0 24 24"><path d="m8.5 12.5 6.7-6.7a3 3 0 0 1 4.2 4.2l-8.8 8.8a5 5 0 0 1-7.1-7.1l8.1-8.1"/></svg>
            </button>
            <textarea id="input" rows="1" maxlength="16000" placeholder="Message à DAVBOT AI..."></textarea>
            <button id="micBtn" class="composer-btn" type="button" title="Dicter un message" aria-label="Microphone">
              <svg viewBox="0 0 24 24"><rect x="8.5" y="3" width="7" height="12" rx="3.5"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6"/></svg>
            </button>
            <button id="sendBtn" class="send-btn" type="button" title="Envoyer" aria-label="Envoyer">
              <svg viewBox="0 0 24 24"><path d="m4 4 16 8-16 8 3-8-3-8Zm3 8h10"/></svg>
            </button>
          </div>
          <div class="composer-note">📷 Analyse d’images • ✨ Génération d’images • DAVBOT AI peut faire des erreurs.</div>
        </div>
      </section>
    </main>
  </div>

  <input id="fileInput" type="file" hidden accept=".txt,.md,.json,.js,.html,.css,.csv,image/*">
  <script src="/app.js" defer></script>
</body>
</html>
