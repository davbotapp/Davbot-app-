<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DAVBOT AI - Projet</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


:root{

--bg:#050816;
--panel:#0b1224;
--blue:#00d2ff;
--blue2:#0066ff;
--border:rgba(255,255,255,.08);

}


body{

height:100vh;

background:var(--bg);

color:white;

font-family:Arial,Helvetica,sans-serif;

overflow:hidden;

}



.app{

display:flex;

height:100vh;

}



/* SIDEBAR */

.sidebar{

width:280px;

background:#080d1b;

border-right:1px solid var(--border);

padding:15px;

display:flex;

flex-direction:column;

}



.brand{

display:flex;

align-items:center;

gap:12px;

margin-bottom:20px;

}



.logo{

width:48px;

height:48px;

display:flex;

align-items:center;

justify-content:center;

border-radius:16px;

font-size:25px;

background:linear-gradient(
135deg,
var(--blue),
var(--blue2)
);

}



.brand h2 span{

color:var(--blue);

}



.brand p{

font-size:12px;

color:#8993aa;

}



.new-chat{

display:block;

text-align:center;

padding:13px;

border-radius:14px;

background:#111a31;

color:white;

text-decoration:none;

}



.menu{

margin-top:20px;

}



.menu a{

display:block;

padding:12px;

margin-bottom:5px;

border-radius:10px;

text-decoration:none;

color:#cbd5e1;

}



.menu a:hover{

background:#111a31;

}



.sidebar h4{

margin-top:20px;

font-size:12px;

color:#68738c;

}



.history{

flex:1;

overflow:auto;

}



.profile{

display:flex;

gap:10px;

align-items:center;

background:#10182d;

padding:12px;

border-radius:15px;

}



.avatar{

width:40px;

height:40px;

display:flex;

justify-content:center;

align-items:center;

border-radius:12px;

background:#18233e;

}



/* MAIN */


.main{

flex:1;

display:flex;

flex-direction:column;

}



.topbar{

height:65px;

display:flex;

justify-content:space-between;

align-items:center;

padding:0 20px;

border-bottom:1px solid var(--border);

}



.online{

color:#4dff91;

font-size:13px;

}





/* PROJECT */


.project-page{

flex:1;

overflow:auto;

padding:30px;

display:flex;

gap:25px;

align-items:flex-start;

}



.project-card,
.project-result{

background:#0b1224;

border:1px solid var(--border);

border-radius:20px;

padding:25px;

width:50%;

}



.project-card h1{

font-size:25px;

margin-bottom:10px;

}



.project-card p{

color:#8993aa;

margin-bottom:25px;

}



label{

display:block;

margin-top:15px;

margin-bottom:7px;

color:#cbd5e1;

font-size:14px;

}



input,
select,
textarea{


width:100%;

padding:13px;

border:none;

outline:none;

border-radius:12px;

background:#101a32;

color:white;

}



textarea{

height:120px;

resize:none;

}



#createProject{


margin-top:20px;

width:100%;

padding:14px;

border:none;

border-radius:14px;

cursor:pointer;

color:white;

font-size:15px;


background:linear-gradient(
135deg,
var(--blue),
var(--blue2)
);


}



.project-result h2{

color:var(--blue);

margin-bottom:15px;

}



.project-result p{

color:#cbd5e1;

line-height:1.6;

white-space:pre-wrap;

}



/* MOBILE */


@media(max-width:800px){


.sidebar{

display:none;

}


.project-page{

display:block;

padding:15px;

}



.project-card,
.project-result{

width:100%;

margin-bottom:20px;

}



}



</style>

</head>


<body>


<div class="app">


<aside class="sidebar">


<div class="brand">

<div class="logo">
🤖
</div>

<div>

<h2>
DAVBOT <span>AI</span>
</h2>

<p>
Assistant intelligent
</p>

</div>

</div>




<a class="new-chat" href="index.html">

← Retour Chat

</a>




<div class="menu">

<a href="index.html">

💬 Chat

</a>


<a href="projet.html">

🚀 Projet

</a>

</div>




<h4>

Mes projets

</h4>


<div class="history" id="projectList">

</div>




<div class="profile">

<div class="avatar">
👤
</div>

<div>

<strong id="userName">
Utilisateur
</strong>

<p>
DAVBOT AI
</p>

</div>

</div>


</aside>





<main class="main">


<header class="topbar">

<h3>
🚀 DAVBOT PROJECT
</h3>


<div class="online">

🟢 IA Active

</div>

</header>





<section class="project-page">


<div class="project-card">


<h1>
Créer un projet avec DAVBOT
</h1>


<p>
Décris ton idée et DAVBOT va créer un plan.
</p>




<label>
Nom du projet
</label>


<input 
id="projectName"
placeholder="Ex: DAVBOT Music"
/>




<label>
Type de projet
</label>


<select id="projectType">

<option>
Site Web
</option>

<option>
Application Mobile
</option>

<option>
Jeu vidéo
</option>

<option>
Business
</option>

<option>
Intelligence Artificielle
</option>

</select>





<label>
Description
</label>


<textarea 
id="projectDescription"
placeholder="Explique ton idée..."
></textarea>





<button id="createProject">

🤖 Créer avec DAVBOT

</button>



</div>





<div class="project-result" id="projectResult">


<h2>
Résultat DAVBOT
</h2>


<p>
Ton projet apparaîtra ici...
</p>


</div>



</section>



</main>


</div>





<script src="app.js"></script>


</body>

</html>
