<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DAVBOT AI</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#050816;
    --panel:#0b1224;
    --panel2:#101a32;
    --border:rgba(255,255,255,.08);
    --blue:#00d2ff;
    --blue2:#0066ff;
    --text:#f5f7ff;
    --muted:#8791aa;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    height:100vh;
    overflow:hidden;
}

button,
textarea{
    font-family:inherit;
}

.app{
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* HEADER */

.header{
    height:65px;
    flex-shrink:0;

    display:flex;
    align-items:center;

    padding:0 15px;

    background:#080d1d;

    border-bottom:1px solid var(--border);

    z-index:10;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;

    font-size:18px;
    font-weight:bold;
}

.logo-icon{
    width:40px;
    height:40px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            var(--blue2)
        );

    box-shadow:
        0 0 25px
        rgba(0,210,255,.3);

    font-size:20px;
}

.logo span{
    color:var(--blue);
}

.online{
    margin-left:auto;

    color:#55ff9a;

    font-size:12px;
}

.online::before{
    content:"●";
    margin-right:5px;
}

/* NEW CHAT */

.new-chat{
    position:fixed;

    top:74px;
    right:12px;

    z-index:20;

    padding:9px 12px;

    border:1px solid var(--border);

    border-radius:12px;

    background:var(--panel2);

    color:#cbd4e9;

    cursor:pointer;

    font-size:12px;
}

.new-chat:hover{
    background:#172442;
}

/* CHAT */

.chat{
    flex:1;

    width:100%;
    max-width:900px;

    margin:auto;

    overflow-y:auto;

    padding:
        25px
        12px
        145px;
}

.chat::-webkit-scrollbar{
    width:5px;
}

.chat::-webkit-scrollbar-thumb{
    background:#172442;
    border-radius:20px;
}

/* WELCOME */

.welcome{
    min-height:55vh;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;
}

.welcome-icon{
    width:80px;
    height:80px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:25px;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            var(--blue2)
        );

    box-shadow:
        0 0 45px
        rgba(0,210,255,.3);

    font-size:36px;

    margin-bottom:20px;
}

.welcome h1{
    font-size:29px;

    margin-bottom:10px;
}

.welcome h1 span{
    color:var(--blue);
}

.welcome p{
    color:var(--muted);

    font-size:14px;
}

.suggestions{
    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    gap:8px;

    margin-top:22px;
}

.suggestion{
    padding:10px 13px;

    border:1px solid var(--border);

    border-radius:13px;

    background:#0c152b;

    color:#b9c3d8;

    cursor:pointer;

    font-size:12px;

    transition:.2s;
}

.suggestion:hover{
    color:white;

    border-color:var(--blue);

    transform:translateY(-2px);
}

/* MESSAGE */

.message{
    display:flex;

    gap:9px;

    margin:18px 0;

    animation:
        messageIn
        .2s
        ease;
}

@keyframes messageIn{

    from{
        opacity:0;
        transform:translateY(7px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.message.user{
    justify-content:flex-end;
}

.avatar{
    width:35px;
    height:35px;

    min-width:35px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:11px;

    background:#111b33;

    font-size:16px;
}

.message.user .avatar{
    order:2;

    background:
        linear-gradient(
            135deg,
            var(--blue2),
            var(--blue)
        );
}

.bubble{
    max-width:80%;

    padding:13px 15px;

    border-radius:17px;

    background:#0d162b;

    border:1px solid var(--border);

    color:#eef2ff;

    font-size:14px;

    line-height:1.6;

    white-space:pre-wrap;

    overflow-wrap:anywhere;
}

.message.user .bubble{
    background:
        linear-gradient(
            135deg,
            #075cff,
            #008dff
        );

    border:none;

    border-bottom-right-radius:5px;
}

.message.assistant .bubble{
    border-bottom-left-radius:5px;
}

/* TYPING */

.typing{
    display:flex;

    align-items:center;

    gap:5px;

    height:18px;
}

.typing span{
    width:6px;
    height:6px;

    border-radius:50%;

    background:var(--blue);

    animation:
        typing 1s infinite;
}

.typing span:nth-child(2){
    animation-delay:.15s;
}

.typing span:nth-child(3){
    animation-delay:.3s;
}

@keyframes typing{

    0%,100%{
        opacity:.2;
        transform:translateY(0);
    }

    50%{
        opacity:1;
        transform:translateY(-4px);
    }

}

/* INPUT */

.input-area{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    padding:
        10px
        12px
        18px;

    background:
        linear-gradient(
            transparent,
            var(--bg) 30%
        );

    z-index:10;
}

.input-box{
    max-width:900px;

    margin:auto;

    display:flex;

    align-items:flex-end;

    gap:8px;

    padding:8px;

    background:#0b1428;

    border:1px solid var(--border);

    border-radius:20px;

    box-shadow:
        0 10px 40px
        rgba(0,0,0,.45);
}

.input-box:focus-within{
    border-color:
        rgba(0,210,255,.4);
}

textarea{
    flex:1;

    min-height:42px;

    max-height:120px;

    resize:none;

    border:0;

    outline:0;

    background:transparent;

    color:white;

    padding:
        11px
        9px;

    font-size:14px;
}

textarea::placeholder{
    color:#68738c;
}

.send{
    width:43px;
    height:43px;

    min-width:43px;

    border:0;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            var(--blue2)
        );

    color:white;

    font-size:18px;

    cursor:pointer;

    transition:.2s;
}

.send:hover{
    transform:scale(1.05);

    box-shadow:
        0 0 20px
        rgba(0,210,255,.3);
}

.send:disabled{
    opacity:.4;

    cursor:not-allowed;

    transform:none;
}

.footer{
    text-align:center;

    color:#46516a;

    font-size:10px;

    margin-top:7px;
}

/* MOBILE */

@media(max-width:600px){

    .header{
        padding:0 12px;
    }

    .logo{
        font-size:16px;
    }

    .online{
        display:none;
    }

    .chat{
        padding:
            25px
            10px
            140px;
    }

    .welcome h1{
        font-size:24px;
    }

    .welcome-icon{
        width:70px;
        height:70px;

        font-size:31px;
    }

    .bubble{
        max-width:88%;

        font-size:13px;
    }

}

</style>

</head>


<body>


<div class="app">


<!-- HEADER -->

<header class="header">

    <div class="logo">

        <div class="logo-icon">
            🤖
        </div>

        DAVBOT <span>AI</span>

    </div>


    <div class="online">
        IA en ligne
    </div>

</header>


<!-- NEW CHAT -->

<button
    class="new-chat"
    id="newChat"
>
    ＋ Nouvelle discussion
</button>


<!-- CHAT -->

<main
    class="chat"
    id="chat"
>


<section
    class="welcome"
    id="welcome"
>

    <div class="welcome-icon">
        🤖
    </div>


    <h1>
        Bienvenue sur
        <span>DAVBOT AI</span>
    </h1>


    <p>
        Pose-moi une question et commençons la discussion.
    </p>


    <div class="suggestions">


        <button
            class="suggestion"
            data-message="Bonjour DAVBOT AI"
        >
            👋 Bonjour
        </button>


        <button
            class="suggestion"
            data-message="Explique-moi ce qu'est l'intelligence artificielle."
        >
            🤖 Intelligence artificielle
        </button>


        <button
            class="suggestion"
            data-message="Donne-moi une idée de projet web."
        >
            💻 Projet web
        </button>


        <button
            class="suggestion"
            data-message="Écris-moi un petit code JavaScript."
        >
            🧑‍💻 JavaScript
        </button>


    </div>

</section>


</main>


<!-- INPUT -->

<div class="input-area">

    <div class="input-box">


        <textarea
            id="messageInput"
            rows="1"
            placeholder="Écris ton message..."
        ></textarea>


        <button
            class="send"
            id="sendButton"
        >
            ➤
        </button>


    </div>


    <div class="footer">
        DAVBOT AI • Powered by Doki API
    </div>

</div>


</div>


<script>

/* =========================================
   DAVBOT AI
   DOKI API
========================================= */


const API_URL =
    "https://doki-api.vercel.app/api/doki";


const chat =
    document.getElementById(
        "chat"
    );

const input =
    document.getElementById(
        "messageInput"
    );

const sendButton =
    document.getElementById(
        "sendButton"
    );

const newChat =
    document.getElementById(
        "newChat"
    );

const welcome =
    document.getElementById(
        "welcome"
    );


/* =========================================
   AJOUT MESSAGE
========================================= */

function addMessage(
    text,
    user
){

    const message =
        document.createElement(
            "div"
        );

    message.className =
        "message " +
        (
            user
            ? "user"
            : "assistant"
        );


    const avatar =
        document.createElement(
            "div"
        );

    avatar.className =
        "avatar";

    avatar.textContent =
        user
        ? "👤"
        : "🤖";


    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";

    bubble.textContent =
        String(text);


    message.appendChild(
        avatar
    );

    message.appendChild(
        bubble
    );

    chat.appendChild(
        message
    );


    chat.scrollTop =
        chat.scrollHeight;


    welcome.style.display =
        "none";

}


/* =========================================
   TYPING
========================================= */

function showTyping(){

    const message =
        document.createElement(
            "div"
        );

    message.id =
        "typingMessage";

    message.className =
        "message assistant";


    message.innerHTML = `

        <div class="avatar">
            🤖
        </div>

        <div class="bubble">

            <div class="typing">

                <span></span>
                <span></span>
                <span></span>

            </div>

        </div>

    `;


    chat.appendChild(
        message
    );


    chat.scrollTop =
        chat.scrollHeight;

}


function removeTyping(){

    const typing =
        document.getElementById(
            "typingMessage"
        );

    if(typing){

        typing.remove();

    }

}


/* =========================================
   DOKI API
========================================= */

async function getDokiResponse(
    message
){

    const response =
        await fetch(
            API_URL,
            {

                method:
                    "POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({
                        message:
                            message
                    })

            }
        );


    if(!response.ok){

        throw new Error(
            "HTTP " +
            response.status
        );

    }


    const data =
        await response.json();


    console.log(
        "DOKI RESPONSE:",
        data
    );


    if(
        typeof data ===
        "string"
    ){

        return data;

    }


    return (

        data.response ||

        data.reply ||

        data.answer ||

        data.message ||

        data.text ||

        data.result ||

        data.content ||

        JSON.stringify(data)

    );

}


/* =========================================
   ENVOYER MESSAGE
========================================= */

async function sendMessage(){

    const text =
        input.value.trim();


    if(!text){

        return;

    }


    if(
        sendButton.disabled
    ){

        return;

    }


    /* USER */

    addMessage(
        text,
        true
    );


    /* RESET */

    input.value =
        "";

    input.style.height =
        "42px";


    sendButton.disabled =
        true;


    /* TYPING */

    showTyping();


    try{


        const answer =
            await getDokiResponse(
                text
            );


        removeTyping();


        addMessage(
            answer,
            false
        );


    }catch(error){


        console.error(
            "DAVBOT ERROR:",
            error
        );


        removeTyping();


        addMessage(
            "❌ Impossible de contacter Doki API.\n\nVérifie ta connexion ou le blocage CORS de TrebEdit.",
            false
        );


    }


    sendButton.disabled =
        false;


    input.focus();

}


/* =========================================
   BOUTON ENVOYER
========================================= */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* =========================================
   ENTER
========================================= */

input.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================
   AUTO RESIZE
========================================= */

input.addEventListener(
    "input",
    function(){

        this.style.height =
            "42px";

        this.style.height =
            Math.min(
                this.scrollHeight,
                120
            ) + "px";

    }
);


/* =========================================
   NOUVELLE DISCUSSION
========================================= */

newChat.addEventListener(
    "click",
    function(){

        chat.innerHTML =
            "";

        chat.appendChild(
            welcome
        );

        welcome.style.display =
            "flex";

        input.value =
            "";

        input.style.height =
            "42px";

        input.focus();

    }
);


/* =========================================
   SUGGESTIONS
========================================= */

document
.querySelectorAll(
    ".suggestion"
)
.forEach(
    function(button){

        button.addEventListener(
            "click",
            function(){

                input.value =
                    this.dataset.message;

                sendMessage();

            }
        );

    }
);


/* =========================================
   START
========================================= */

console.log(
    "🤖 DAVBOT AI lancé"
);

console.log(
    "Doki API :",
    API_URL
);

</script>


</body>
</html>
